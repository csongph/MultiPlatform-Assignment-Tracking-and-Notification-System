version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kmaps
      POSTGRES_PASSWORD: kmaps
      POSTGRES_DB: kmaps_db
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
