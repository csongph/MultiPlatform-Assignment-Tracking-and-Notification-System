<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="KMAPS - รายวิชาและงานที่ได้รับมอบหมาย" />
  <link rel="icon" type="image/png" href="../assets/image/logoweb-256.png" />
  <title>งานที่ได้รับมอบหมาย - LMS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN (same config as dashboard.html) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              purple: '#2d1b4e',
              'purple-dark': '#23153d',
              lime: '#c8f561',
              'lime-hover': '#b8e850',
              yellow: '#fff159',
              red: '#ff173d',
              green: '#00e65b',
              surface: '#ececf1',
              progress: '#c884c7',
            }
          },
          fontFamily: {
            prompt: ['Prompt', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
          },
          borderRadius: { '3xl': '24px', '4xl': '28px', '5xl': '32px' }
        }
      }
    }
  </script>

  <!-- Existing shared styles (read-only) + this page's own additive styles -->
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/assignments.css" />
</head>
<body class="bg-[#f0f2f6] text-slate-800 font-prompt min-h-screen p-3 md:p-6 lg:p-8 flex justify-center items-start selection:bg-brand-lime selection:text-slate-900">

  <div class="w-full max-w-[1400px] flex flex-col md:flex-row gap-5 lg:gap-6 items-stretch">

    <!-- Shared sidebar component (teammate's) -->
    <div id="sidebar-container" class="shrink-0 w-full md:w-[220px] lg:w-[240px]"></div>

    <main class="flex-1 flex flex-col gap-5 lg:gap-6 min-w-0" role="main">

      <div id="dev-banner" class="asg-dev-banner hidden">
        🛠️ โหมดพรีวิว: ยังไม่ได้ล็อกอิน จึงแสดงข้อมูลจำลอง (ล็อกอินแล้วจะดึงข้อมูลจริงจาก API)
      </div>

      <!-- TOP BAR -->
      <header class="flex flex-col sm:flex-row items-center justify-between gap-3 md:gap-4 w-full">
        <div class="relative w-full sm:flex-1 max-w-[560px]">
          <input
            type="text"
            id="search-input"
            class="md3-search-pill w-full py-2.5 pl-5 pr-11 text-sm bg-white text-slate-800 placeholder-slate-400 focus:outline-none font-prompt"
            placeholder="ค้นหาชื่องาน หรือ รายวิชา..."
            aria-label="ค้นหาชื่องานหรือรายวิชา"
          />
          <svg class="w-5 h-5 absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>

        <div class="flex items-center gap-3 shrink-0 self-end sm:self-auto">
          <div class="md3-chip-lime flex items-center gap-2.5 py-1.5 px-3.5 shadow-sm" title="ข้อมูลผู้ใช้งาน">
            <div class="w-8 h-8 rounded-full bg-amber-100 flex items-center justify-center overflow-hidden border border-lime-600/20 shrink-0">
              <svg class="w-7 h-7" viewBox="0 0 36 36">
                <path fill="#FFCC4D" d="M18 3c-4.4 0-8 3.6-8 8v5c0 4.4 3.6 8 8 8s8-3.6 8-8v-5c0-4.4-3.6-8-8-8z"/>
                <path fill="#DD2E44" d="M11 6c1 2 4 4 7 4s6-2 7-4c-2-3-5-4-7-4s-5 1-7 4z"/>
                <circle cx="14" cy="14" r="1.5" fill="#292F33"/><circle cx="22" cy="14" r="1.5" fill="#292F33"/>
                <path fill="#55ACEE" d="M18 24c-6 0-11 4-11 9v3h22v-3c0-5-5-9-11-9z"/>
              </svg>
            </div>
            <div class="flex flex-col text-left leading-tight">
              <span id="user-display-name" class="font-bold text-xs sm:text-sm text-slate-900 tracking-tight">กำลังโหลด...</span>
              <span id="user-role-badge" class="text-[11px] font-medium text-slate-700">นักเรียน</span>
            </div>
          </div>

          <button type="button" id="logout-button" class="md3-chip-lime w-10 h-10 flex items-center justify-center p-2 shadow-sm cursor-pointer focus:outline-none" title="ออกจากระบบ" aria-label="ออกจากระบบ">
            <svg class="w-5 h-5 text-slate-900" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- STAT CARDS (4) -->
      <section class="grid grid-cols-2 lg:grid-cols-4 gap-4" aria-label="สรุปสถานะงาน">
        <article class="stat-card stat-card-yellow p-5 flex flex-col justify-between min-h-[110px]">
          <span class="text-xs sm:text-sm font-medium">งานที่ได้รับมอบหมายทั้งหมด</span>
          <strong id="stat-total" class="font-outfit text-4xl sm:text-5xl font-bold mt-2">0</strong>
        </article>
        <article class="stat-card stat-card-red p-5 flex flex-col justify-between min-h-[110px]">
          <span class="text-xs sm:text-sm font-medium">ครบกำหนดวันนี้</span>
          <strong id="stat-today" class="font-outfit text-4xl sm:text-5xl font-bold mt-2">0</strong>
        </article>
        <article class="stat-card asg-stat-overdue p-5 flex flex-col justify-between min-h-[110px]">
          <span class="text-xs sm:text-sm font-medium">เกินกำหนด / ค้างส่ง</span>
          <strong id="stat-overdue" class="font-outfit text-4xl sm:text-5xl font-bold mt-2">0</strong>
        </article>
        <article class="stat-card stat-card-green p-5 flex flex-col justify-between min-h-[110px]">
          <span class="text-xs sm:text-sm font-medium">งานที่ส่งแล้ว</span>
          <strong id="stat-submitted" class="font-outfit text-4xl sm:text-5xl font-bold mt-2">0</strong>
        </article>
      </section>

      <!-- MAIN PANEL -->
      <section class="md3-surface-panel p-5 sm:p-8 flex flex-col gap-5" aria-label="รายการงาน">
        <h1 class="text-xl sm:text-2xl font-bold text-slate-800 tracking-tight">งานที่ได้รับมอบหมาย</h1>

        <!-- Course filter chips -->
        <div id="course-chips" class="flex gap-3 overflow-x-auto pb-1" aria-label="กรองตามรายวิชา"></div>

        <!-- Toolbar -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
          <div id="tab-bar" class="flex flex-wrap gap-2" role="tablist" aria-label="กรองตามสถานะ">
            <button type="button" class="asg-tab" data-tab="all">ทั้งหมด<span class="asg-count">0</span></button>
            <button type="button" class="asg-tab" data-tab="pending">ยังไม่ส่ง<span class="asg-count">0</span></button>
            <button type="button" class="asg-tab" data-tab="overdue">เกินกำหนด<span class="asg-count">0</span></button>
            <button type="button" class="asg-tab" data-tab="submitted">ส่งแล้ว<span class="asg-count">0</span></button>
          </div>
          <div class="flex flex-wrap gap-2">
            <select id="filter-platform" class="px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-full font-prompt focus:outline-none" aria-label="แพลตฟอร์ม">
              <option value="all">ทุกแพลตฟอร์ม</option>
              <option value="google">Google Classroom</option>
              <option value="microsoft">Microsoft Teams</option>
              <option value="custom">งานที่เพิ่มเอง</option>
            </select>
            <select id="sort-by" class="px-3 py-1.5 text-xs bg-white border border-slate-200 rounded-full font-prompt focus:outline-none" aria-label="จัดเรียงตาม">
              <option value="due">เรียง: กำหนดส่งใกล้สุด</option>
              <option value="title">เรียง: ชื่องาน ก-ฮ / A-Z</option>
            </select>
          </div>
        </div>

        <!-- Task cards -->
        <div id="task-list" class="flex flex-col gap-4"></div>
      </section>
    </main>
  </div>

  <!-- Reminder modal -->
  <div id="reminder-modal" class="asg-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="reminder-heading">
    <div class="asg-modal">
      <h2 id="reminder-heading" class="text-lg font-bold text-slate-900">ตั้งแจ้งเตือนล่วงหน้า</h2>
      <p id="reminder-task-title" class="text-xs text-slate-500 mt-1 mb-4"></p>

      <label class="block text-xs font-medium text-slate-700 mb-1" for="reminder-value">แจ้งเตือนก่อนครบกำหนด</label>
      <div class="flex gap-2">
        <input id="reminder-value" type="number" min="1" step="1" value="1" class="w-24 px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-brand-purple" />
        <select id="reminder-unit" class="flex-1 px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:border-brand-purple">
          <option value="minutes">นาที</option>
          <option value="hours">ชั่วโมง</option>
          <option value="days" selected>วัน</option>
        </select>
      </div>
      <p id="reminder-error" class="hidden text-xs text-red-600 mt-2">กรุณากรอกจำนวนเต็มตั้งแต่ 1 ขึ้นไป</p>

      <div class="flex flex-wrap justify-end gap-2 mt-6">
        <button type="button" id="reminder-remove" class="hidden asg-btn !border-red-300 !text-red-600">ลบแจ้งเตือน</button>
        <button type="button" id="reminder-cancel" class="asg-btn">ยกเลิก</button>
        <button type="button" id="reminder-save" class="asg-btn asg-btn-primary">บันทึก</button>
      </div>
    </div>
  </div>

  <script>
    window.KMAPS_API_BASE = 'http://localhost:8000/api/v1';
    window.KMAPS_USE_MOCK_API = false;
  </script>
  <script type="module" src="../js/assignments.js"></script>
</body>
</html>
