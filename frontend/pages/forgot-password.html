<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="กู้คืนรหัสผ่านบัญชี KMAPS" />
  <link rel="icon" type="image/png" href="../assets/image/logoweb-256.png" />
  <title>กู้คืนรหัสผ่าน - KMAPS</title>
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="stylesheet" href="../css/login.css" />
  <link rel="stylesheet" href="../css/password-recovery.css" />
</head>
<body>
  <div class="auth-page">
    <main class="auth-card recovery-card">
      <a class="recovery-brand" href="login.html" aria-label="กลับไปหน้าเข้าสู่ระบบ KMAPS">KMAPS</a>
      <p id="recovery-step-count" class="recovery-step-count">ขั้นตอนที่ 1 จาก 3</p>
      <h1 class="auth-title">กู้คืนรหัสผ่าน</h1>
      <p class="auth-subtitle">ยืนยันบัญชีของคุณเพื่อตั้งรหัสผ่านใหม่</p>
      <p id="recovery-message" class="recovery-message hidden" role="status" aria-live="polite"></p>

      <form id="request-code-form" class="auth-form recovery-step" novalidate>
        <div class="form-group">
          <label class="form-label" for="recovery-email">อีเมลบัญชี KMAPS</label>
          <div class="input-group"><input id="recovery-email" class="form-input" type="email" name="email" autocomplete="email" required maxlength="255" /></div>
        </div>
        <button class="btn btn-primary" type="submit"><span class="btn-text">ส่งรหัสยืนยัน</span></button>
      </form>

      <form id="verify-code-form" class="auth-form recovery-step hidden" novalidate>
        <p class="recovery-instruction">กรอกรหัส 6 หลักจากอีเมลที่ส่งให้ หากไม่พบอีเมลให้ตรวจสอบโฟลเดอร์สแปม</p>
        <div class="form-group">
          <label class="form-label" for="recovery-otp">รหัส OTP</label>
          <div class="input-group"><input id="recovery-otp" class="form-input recovery-otp" type="text" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required aria-describedby="recovery-message" /></div>
        </div>
        <button class="btn btn-primary" type="submit"><span class="btn-text">ยืนยันรหัส</span></button>
        <button id="resend-code-button" class="recovery-secondary-button" type="button" disabled>ส่งรหัสอีกครั้งใน 60 วินาที</button>
      </form>

      <form id="reset-password-form" class="auth-form recovery-step hidden" novalidate>
        <div class="form-group">
          <label class="form-label" for="new-password">รหัสผ่านใหม่</label>
          <div class="input-group"><input id="new-password" class="form-input" type="password" name="new_password" autocomplete="new-password" minlength="8" maxlength="72" required /></div>
          <small class="recovery-hint">ใช้รหัสผ่านอย่างน้อย 8 ตัวอักษร</small>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-password">ยืนยันรหัสผ่านใหม่</label>
          <div class="input-group"><input id="confirm-password" class="form-input" type="password" name="confirm_password" autocomplete="new-password" minlength="8" maxlength="72" required /></div>
        </div>
        <button class="btn btn-primary" type="submit"><span class="btn-text">บันทึกรหัสผ่านใหม่</span></button>
      </form>

      <a class="recovery-back-link" href="login.html">กลับไปหน้าเข้าสู่ระบบ</a>
    </main>
  </div>
  <script src="../config.js"></script>
  <script type="module" src="../js/forgot-password.js"></script>
</body>
</html>
