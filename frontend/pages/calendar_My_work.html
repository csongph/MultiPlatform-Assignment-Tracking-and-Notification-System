<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>07_calendar_My_work</title>
  <!-- Google Fonts: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- External Custom CSS -->
  <link rel="stylesheet" href="calendarstyle.css">
</head>
<body>

  <div class="app-layout">
    
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo-box">
        <div class="logo-icon">
          <i class="fa-solid fa-graduation-cap"></i>
          <span class="logo-text">LMS</span>
        </div>
      </div>

      <ul class="menu-list">
        <li class="menu-item">
          <a href="#"><i class="fa-solid fa-border-all"></i> ภาพรวม</a>
        </li>
        <li class="menu-item">
          <a href="#"><i class="fa-solid fa-book-open"></i> รายวิชา</a>
        </li>
        <li class="menu-item">
          <a href="#"><i class="fa-regular fa-square-check"></i> งานที่ได้รับมอบหมาย</a>
        </li>
        <li class="menu-item">
          <a href="#"><i class="fa-regular fa-bell"></i> การแจ้งเตือน</a>
        </li>
        <li class="menu-item active">
          <a href="#"><i class="fa-regular fa-calendar-days"></i> ปฏิทิน</a>
        </li>
      </ul>
    </aside>
    <!-- MAIN CONTENT AREA -->
    <main class="main-content">
      
      <!-- TOP HEADER -->
      <header class="top-header">
        <div class="search-container">
          <input type="text" class="search-input" placeholder="ค้นหารายวิชา">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
        </div>

        <div class="header-right">
          <div class="user-pill">
            <div class="avatar">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Kunagron" alt="Avatar">
            </div>
            <div class="user-details">
              <span class="user-name">K.Kunagron</span>
              <span class="user-role">นักเรียน</span>
            </div>
          </div>

          <button class="logout-btn" title="ออกจากระบบ">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </header>

      <!-- STATS CARDS -->
      <section class="stats-grid">
        <div class="stat-card">
          <span class="stat-title">งานทั้งหมด</span>
          <span class="stat-value">3</span>
        </div>
        <div class="stat-card">
          <span class="stat-title">ส่งแล้ว</span>
          <span class="stat-value">1</span>
        </div>
        <div class="stat-card">
          <span class="stat-title">รอดำเนินการ</span>
          <span class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-title">อัตราการส่งงาน</span>
          <span class="stat-value">33.33%</span>
        </div>
      </section>

      <!-- CALENDAR BOARD -->
      <section class="calendar-card">
        
        <!-- Controls Header -->
        <div class="calendar-controls">
          <button class="nav-arrow" id="prev-month"><i class="fa-solid fa-chevron-left"></i></button>
          
          <div class="select-boxes">
            <select class="custom-select" id="month-select">
              <option value="Sep" selected>Sep</option>
              <option value="Oct">Oct</option>
              <option value="Nov">Nov</option>
            </select>
            <select class="custom-select" id="year-select">
              <option value="2026" selected>2026</option>
              <option value="2027">2027</option>
            </select>
          </div>

          <button class="nav-arrow" id="next-month"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <!-- Grid Dates -->
        <div class="calendar-grid-wrapper">
          <div class="weekdays-row">
            <div>Su</div>
            <div>Mo</div>
            <div>Tu</div>
            <div>We</div>
            <div>Th</div>
            <div>Fr</div>
            <div>Sa</div>
          </div>

          <div class="days-grid">
            <!-- Row 1 -->
            <div class="day-cell"></div>
            <div class="day-cell">1</div>
            <div class="day-cell">2</div>
            <div class="day-cell">3</div>
            <div class="day-cell">4</div>
            <div class="day-cell">5</div>
            <div class="day-cell">6</div>

            <!-- Row 2 -->
            <div class="day-cell">7</div>
            <div class="day-cell">8</div>
            <div class="day-cell"><div class="badge-black">9</div></div>
            <div class="day-cell">10</div>
            <div class="day-cell">11</div>
            <div class="day-cell">12</div>
            <div class="day-cell"><div class="badge-black">13</div></div>

            <!-- Row 3 -->
            <div class="day-cell">14</div>
            <div class="day-cell">15</div>
            <div class="day-cell">16</div>
            <div class="day-cell">17</div>
            <div class="day-cell">18</div>
            <div class="day-cell">19</div>
            <div class="day-cell">20</div>

            <!-- Row 4 -->
            <div class="day-cell">21</div>
            <div class="day-cell">22</div>
            <div class="day-cell">23</div>
            <div class="day-cell">24</div>
            <div class="day-cell">25</div>
            <div class="day-cell">26</div>
            <div class="day-cell">27</div>

            <!-- Row 5 -->
            <div class="day-cell">28</div>
            <div class="day-cell">29</div>
            <div class="day-cell">30</div>
            <div class="day-cell other-month">1</div>
            <div class="day-cell other-month">2</div>
            <div class="day-cell other-month">3</div>
            <div class="day-cell other-month">4</div>
          </div>
        </div>

      </section>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
