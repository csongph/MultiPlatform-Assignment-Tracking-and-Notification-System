<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KMAPS - ปฏิทินและการแจ้งเตือน</title>
  <!-- Google Fonts: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            prompt: ['Prompt', 'sans-serif'],
          },
        }
      }
    }
  </script>
</head>
<body class="bg-[#f0f0f2] flex justify-center items-center min-h-screen p-5 font-prompt">

  <div class="app-container flex w-full max-w-[1280px] h-[850px] bg-white rounded-[24px] overflow-hidden shadow-lg p-4 gap-5">
    
    <!-- Left Sidebar -->
    <aside class="sidebar w-[260px] bg-gradient-to-b from-[#1d0c33] via-[#3a225e] to-[#573a81] rounded-[20px] flex flex-col p-[24px_16px] text-white">
      <div class="brand-logo flex justify-center items-center mb-10 mt-2">
        <div class="w-[70px] h-[70px] bg-gradient-to-br from-[#7b2cbf] to-[#ff007f] rounded-full flex justify-center items-center text-3xl shadow-[0_4px_15px_rgba(255,0,127,0.4)]">
          <i class="fa-solid fa-graduation-cap text-white"></i>
        </div>
      </div>

      <nav class="nav-menu flex flex-col gap-4 flex-grow justify-center">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3.5 rounded-[14px] text-[#d1d0d7] text-sm font-medium hover:text-white transition-all">
          <i class="fa-solid fa-border-all text-xl"></i>
          <span>ภาพรวม</span>
        </a>
        <a href="assignments.html" class="flex items-center gap-3 px-4 py-3.5 rounded-[14px] text-[#d1d0d7] text-sm font-medium hover:text-white transition-all">
          <i class="fa-solid fa-square-check text-xl"></i>
          <span>งานที่ได้รับมอบหมาย</span>
        </a>
        <a href="calendar.html" class="flex items-center gap-3 px-4 py-3.5 rounded-[14px] bg-[#ccff00] text-[#1a1a1a] font-semibold shadow-[0_4px_12px_rgba(204,255,0,0.3)] text-sm">
          <i class="fa-solid fa-calendar-days text-xl"></i>
          <span>ปฏิทินและการแจ้งเตือน</span>
        </a>
      </nav>
    </aside>

    <!-- Right Main Content -->
    <main class="main-content flex-1 flex flex-col gap-4">
      <!-- Top Bar Header -->
      <header class="top-bar flex justify-between items-center gap-4">
        <div class="search-box flex-1 relative">
          <input id="calendar-search" type="search" placeholder="ค้นหารายวิชา" class="w-full py-2.5 pl-5 pr-10 rounded-full border border-[#dcdcdc] outline-none text-sm text-gray-800">
          <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
        </div>

        <div class="user-profile flex items-center gap-3 bg-[#ccff00] px-4 py-1.5 rounded-full">
          <div class="w-9 h-9 rounded-full bg-amber-500 flex items-center justify-center overflow-hidden">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Kunagron" alt="User Avatar" class="w-full h-full object-cover">
          </div>
          <div class="flex flex-col leading-tight">
            <span class="text-xs font-bold text-[#1a1a1a]">K.Kunagron</span>
            <span class="text-[11px] text-gray-600">นักเรียน</span>
          </div>
        </div>

        <a href="login.html" class="w-[46px] h-[46px] bg-[#ccff00] rounded-xl flex items-center justify-center text-[#1a1a1a] text-lg hover:scale-105 transition-transform" title="ออกจากระบบ">
          <i class="fa-solid fa-right-from-bracket"></i>
        </a>
      </header>

      <!-- Dashboard Stats Cards -->
      <section class="summary-cards grid grid-cols-3 gap-4">
        <div class="card bg-[#ffff52] text-[#1a1a1a] rounded-2xl p-[16px_20px] h-[110px] flex flex-col justify-between shadow-sm">
          <span class="text-xs font-semibold">งานที่ได้รับมอบหมายทั้งหมด</span>
          <span class="text-4xl font-bold leading-none" id="total-tasks">0</span>
        </div>
        <div class="card bg-[#ff1e1e] text-white rounded-2xl p-[16px_20px] h-[110px] flex flex-col justify-between shadow-sm">
          <span class="text-xs font-semibold">ครบกำหนดวันนี้</span>
          <span class="text-4xl font-bold leading-none" id="due-tasks">0</span>
        </div>
        <div class="card bg-[#00e659] text-[#1a1a1a] rounded-2xl p-[16px_20px] h-[110px] flex flex-col justify-between shadow-sm">
          <span class="text-xs font-semibold">งานที่ส่งแล้ว</span>
          <span class="text-4xl font-bold leading-none" id="submitted-tasks">0</span>
        </div>
      </section>

      <!-- Calendar Section -->
      <section class="calendar-wrapper flex-1 bg-[#e5e5e8] rounded-[20px] p-5 flex flex-col items-center gap-4 overflow-y-auto">
        <div class="calendar-header-controls flex gap-2.5">
          <select id="monthSelect" class="px-4 py-1.5 rounded-full border border-gray-300 bg-white text-sm outline-none font-medium cursor-pointer">
            <option value="0">มกราคม</option><option value="1">กุมภาพันธ์</option><option value="2">มีนาคม</option>
            <option value="3">เมษายน</option><option value="4">พฤษภาคม</option><option value="5">มิถุนายน</option>
            <option value="6">กรกฎาคม</option><option value="7">สิงหาคม</option><option value="8">กันยายน</option>
            <option value="9">ตุลาคม</option><option value="10">พฤศจิกายน</option><option value="11">ธันวาคม</option>
          </select>

          <select id="yearSelect" class="px-4 py-1.5 rounded-full border border-gray-300 bg-white text-sm outline-none font-medium cursor-pointer">
            <option value="2025">2568</option><option value="2026">2569</option><option value="2027">2570</option><option value="2028">2571</option>
          </select>
        </div>

        <div class="calendar-card bg-white rounded-[20px] w-full max-w-[650px] p-6 shadow-sm">
          <!-- Weekdays Grid -->
          <div class="weekdays-grid grid grid-cols-7 text-center font-semibold text-gray-600 text-sm mb-5">
            <div>อา.</div>
            <div>จ.</div>
            <div>อ.</div>
            <div>พ.</div>
            <div>พฤ.</div>
            <div>ศ.</div>
            <div>ส.</div>
          </div>

          <!-- Days Grid -->
          <div class="days-grid grid grid-cols-7 gap-y-3 gap-x-2.5 text-center" id="daysGrid">
            <!-- Rendered dynamically by JS -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal for Day Details and Task Submission -->
  <div class="modal-overlay fixed inset-0 bg-black/50 hidden justify-center items-center z-50" id="taskModal">
    <div class="modal-card bg-white w-[90%] max-w-[450px] rounded-[20px] p-6 shadow-2xl">
      <div class="modal-header flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-[#1a1a1a]" id="modalDateTitle">การส่งงานวันที่ -</h3>
        <i class="fa-solid fa-xmark text-xl text-gray-400 cursor-pointer hover:text-gray-600"></i>
      </div>

      <div id="modalTaskContent"></div>

      <form class="submission-form mt-4" id="submissionForm">
        <hr class="my-4 border-gray-200">
        <label for="taskNote" class="block text-xs font-semibold mb-1.5">ข้อความส่งงาน / หมายเหตุส่วนตัว:</label>
        <input type="text" id="taskNote" placeholder="ระบุข้อความ..." required class="w-full p-[10px] rounded-lg border border-gray-300 mb-3 text-xs outline-none focus:border-green-500">
        <p class="text-xs text-gray-500 mb-3">บันทึกสถานะส่วนตัวใน KMAPS ไม่ได้ส่งงานไปยัง Google Classroom หรือ Microsoft Teams</p>
        <button type="submit" class="w-full py-3 bg-[#00e659] hover:bg-[#00c74b] rounded-lg font-bold text-[#1a1a1a] transition-colors">บันทึกว่าส่งแล้ว</button>
      </form>
    </div>
  </div>

  <!-- JavaScript File -->
  <script type="module" src="../js/calendar.js"></script>
</body>
</html>
