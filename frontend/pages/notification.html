<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/image/logoweb-256.png">
  <title>การแจ้งเตือน - LMS KMAPS</title>
  <!-- Google Fonts: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- External Custom CSS -->
  <link rel="stylesheet" href="../css/notification.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/navigation.css">
</head>
<body class="app-page">
    
  <div class="app-viewport-layout">
    <div class="app-sidebar-container" id="kmaps-sidebar-container"></div>
    <main class="app-main-container">
      <div id="kmaps-topbar-container"></div>
      <div class="app-content">
        <header class="app-header"><div><p class="app-eyebrow">KMAPS</p><h1>การแจ้งเตือน</h1></div></header>

      <!-- STATS CARDS -->
      <section class="stats-grid">
        <div class="stat-card stat-card-total">
          <span class="stat-title">งานทั้งหมด</span>
          <span class="stat-value" id="stat-total">0</span>
        </div>
        <div class="stat-card stat-card-submitted">
          <span class="stat-title">ส่งแล้ว</span>
          <span class="stat-value" id="stat-submitted">0</span>
        </div>
        <div class="stat-card stat-card-pending">
          <span class="stat-title">รอดำเนินการ</span>
          <span class="stat-value" id="stat-pending">0</span>
        </div>
        <div class="stat-card stat-card-rate">
          <span class="stat-title">อัตราการส่งงาน</span>
          <span class="stat-value" id="stat-rate">0%</span>
        </div>
      </section>

      <section class="notification-card configured-reminders-card" aria-labelledby="configured-reminders-heading">
        <div class="configured-reminders-heading">
          <div>
            <h2 id="configured-reminders-heading">รายการแจ้งเตือนที่ตั้งไว้</h2>
            <p>แสดงกฎเตือนที่คุณสร้าง แม้ยังไม่ถึงเวลาส่งแจ้งเตือน</p>
          </div>
          <div class="configured-reminders-actions">
            <span id="notification-rules-count" class="configured-reminders-count">กำลังโหลด...</span>
            <a class="configured-reminders-link" href="assignments.html">จัดการการเตือน</a>
          </div>
        </div>
        <div id="notification-rules-list" class="notification-list" aria-live="polite">
          <div class="notification-loading">กำลังโหลดรายการที่ตั้งไว้...</div>
        </div>
      </section>

      <!-- NOTIFICATIONS BOARD -->
      <section class="notification-card">

        <div class="notification-controls">
          <div class="notification-tabs" role="tablist" aria-label="กรองการแจ้งเตือน">
            <button type="button" class="notification-tab active" data-filter="all" role="tab" aria-selected="true">
              ทั้งหมด <span class="count-pill" id="tab-count-all">0</span>
            </button>
            <button type="button" class="notification-tab" data-filter="unread" role="tab" aria-selected="false">
              ยังไม่อ่าน <span class="count-pill" id="tab-count-unread">0</span>
            </button>
          </div>

          <button type="button" class="mark-all-btn" id="mark-all-btn">
            <i class="fa-solid fa-check-double"></i> ทำเครื่องหมายว่าอ่านทั้งหมด
          </button>
        </div>

        <div id="notification-list" class="notification-list">
          <div class="notification-loading">กำลังโหลดการแจ้งเตือน...</div>
        </div>

      </section>

      </div>
    </main>
  </div>

  <script src="../config.js"></script>
  <script type="module" src="../js/notification.js"></script>
</body>
</html>
